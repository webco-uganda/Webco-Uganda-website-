<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEBCO Admin</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="pagehero"><div class="container"><div class="eyebrow">WEBCO Platform</div><h1>Administration Portal</h1><p>Manage members, projects, volunteers, messages, news, events and support records.</p></div></div>
<section><div class="container" id="app"></div></section>
<script>
async function api(u,o={}){let r=await fetch(u,{headers:{"Content-Type":"application/json"},...o});let d=await r.json();if(!r.ok)throw Error(d.error||"Error");return d}
const app=document.getElementById('app');
async function boot(){let s=await api('/api/status'); if(s.setupRequired){app.innerHTML=`<div class="card"><h2>First-time setup</h2><p>Create the first WEBCO administrator account. This is only available before an admin exists.</p><form id="setup" class="form"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field full"><label>Password (10+ characters)</label><input name="password" type="password" minlength="10" required></div><button class="btn gold full">CREATE ADMIN</button><p class="msg full"></p></form></div>`;document.getElementById('setup').onsubmit=async e=>{e.preventDefault();try{await api('/api/setup',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});boot()}catch(x){e.target.querySelector('.msg').textContent=x.message}};return}
if(!s.admin){app.innerHTML=`<div class="card"><h2>Admin Login</h2><form id="login" class="form"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn gold full">LOGIN</button><p class="msg full"></p></form></div>`;document.getElementById('login').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});boot()}catch(x){e.target.querySelector('.msg').textContent=x.message}};return}
renderDashboard()}
async function renderDashboard(){let st=await api('/api/admin/stats');app.innerHTML=`<div class="statgrid"><div class="stat"><strong>${st.members}</strong>Members</div><div class="stat"><strong>${st.activeMembers}</strong>Active members</div><div class="stat"><strong>${st.projects}</strong>Projects</div><div class="stat"><strong>${st.volunteers}</strong>Volunteers</div></div><section style="padding:30px 0"><div class="grid3"><div class="card"><h3>Add Project</h3><form id="project" class="form"><div class="field full"><label>Name</label><input name="name" required></div><div class="field"><label>Programme</label><input name="programme"></div><div class="field"><label>District</label><input name="district"></div><div class="field"><label>Beneficiaries</label><input name="beneficiaries"></div><div class="field"><label>Status</label><select name="status"><option>planned</option><option>active</option><option>completed</option><option>paused</option></select></div><div class="field full"><label>Description</label><textarea name="description"></textarea></div><div class="field full"><button class="btn gold">ADD PROJECT</button></div><p class="msg full"></p></form></div><div class="card"><h3>Add News</h3><form id="news" class="form"><div class="field full"><label>Title</label><input name="title" required></div><div class="field"><label>Location</label><input name="location"></div><div class="field"><label>Programme</label><input name="programme"></div><div class="field full"><label>Article</label><textarea name="body" required></textarea></div><button class="btn gold full">PUBLISH NEWS</button><p class="msg full"></p></form></div><div class="card"><h3>Add Event</h3><form id="event" class="form"><div class="field full"><label>Name</label><input name="name" required></div><div class="field"><label>Date</label><input name="date" type="date"></div><div class="field"><label>Time</label><input name="time"></div><div class="field full"><label>Location</label><input name="location"></div><div class="field full"><label>Description</label><textarea name="description"></textarea></div><button class="btn gold full">ADD EVENT</button><p class="msg full"></p></form></div></div></section><div class="card"><h2>Members</h2><div id="members">Loading…</div></div><br><div class="card"><h2>Volunteers</h2><div id="volunteers">Loading…</div></div><br><div class="card"><h2>Messages</h2><div id="messages">Loading…</div></div><br><div class="card"><h2>Donations / Support</h2><div id="donations">Loading…</div></div><br><button class="btn navy" id="logout">LOG OUT</button>`;
document.getElementById('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});boot()};
for(const [id,url] of [['members','/api/admin/members'],['volunteers','/api/admin/volunteers'],['messages','/api/admin/messages'],['donations','/api/admin/donations']]){const el=document.getElementById(id);const rows=await api(url);el.innerHTML=rows.length?'<table><tbody>'+rows.map(r=>'<tr>'+Object.entries(r).slice(0,8).map(([k,v])=>`<td><strong>${k}</strong><br>${String(v??'')}</td>`).join('')+'</tr>').join('')+'</tbody></table>':'<p>None yet.</p>'}
document.querySelectorAll('form[id]').forEach(f=>{let endpoint=f.id==='project'?'/api/admin/projects':f.id==='news'?'/api/admin/news':'/api/admin/events';f.onsubmit=async e=>{e.preventDefault();try{await api(endpoint,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f)))});f.querySelector('.msg').textContent='Saved.';f.reset()}catch(x){f.querySelector('.msg').textContent=x.message}}})}
boot();
</script></body></html>
