<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEBCO Member Portal</title><link rel="stylesheet" href="/style.css"></head><body><div class="pagehero"><div class="container"><div class="eyebrow">WEBCO Member Portal</div><h1>My WEBCO</h1><p>Membership dashboard and future access point for events, training, documents and opportunities.</p></div></div><section><div class="container" id="app"></div></section><script>
async function api(u,o={}){let r=await fetch(u,{headers:{"Content-Type":"application/json"},...o});let d=await r.json();if(!r.ok)throw Error(d.error||"Error");return d}
async function boot(){let s=await api('/api/status');const app=document.getElementById('app');if(!s.member){app.innerHTML='<div class="card"><h2>Member Login</h2><form id="login" class="form"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn gold full">LOGIN</button><p class="msg full"></p></form><p style="margin-top:15px">Not a member? <a class="link" href="/membership.html">Apply here.</a></p></div>';document.getElementById('login').onsubmit=async e=>{e.preventDefault();try{await api('/api/members/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});boot()}catch(x){e.target.querySelector('.msg').textContent=x.message}};return}let m=await api('/api/members/me');app.innerHTML='<div class="card"><h2>Welcome, '+m.full_name+'</h2><div class="grid3"><div><strong>Membership No.</strong><p>'+m.membership_no+'</p></div><div><strong>Status</strong><p>'+m.status+'</p></div><div><strong>Category</strong><p>'+m.category+'</p></div></div><p><strong>District:</strong> '+(m.district||'—')+'</p><button class="btn navy" id="logout">LOG OUT</button></div><br><div class="grid3"><div class="card"><h3>Events</h3><p>Future event registration will appear here.</p></div><div class="card"><h3>Training</h3><p>Future training opportunities will appear here.</p></div><div class="card"><h3>Documents</h3><p>Future member-only documents will appear here.</p></div></div>';document.getElementById('logout').onclick=async()=>{await api('/api/members/logout',{method:'POST'});boot()}}
boot();
</script></body></html>
